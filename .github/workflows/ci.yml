name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Toolchain check
        run: python -m viralcut doctor

      - name: Tests
        run: pytest -q

  no-media-committed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if media or secrets were committed
        run: |
          set -e
          pattern='\.(mp4|mkv|mov|avi|webm|m4v|flv|wmv|mp3|wav|m4a|aac|flac|ogg|opus)$'
          if git ls-files | grep -Ei "$pattern"; then
            echo "::error::Media files must never be committed — see docs/COMPLIANCE.md"
            exit 1
          fi
          if git ls-files | grep -Ei '(^|/)(\.env|cookies\.txt|credentials\.json|token.*\.json)$'; then
            echo "::error::Credential-like file committed — see docs/COMPLIANCE.md"
            exit 1
          fi
          big=$(git ls-files -z | xargs -0 -I{} du -k "{}" | awk '$1 > 5120 {print $2}')
          if [ -n "$big" ]; then
            echo "::error::Files over 5 MB committed:"; echo "$big"; exit 1
          fi
          echo "Clean: code only."
