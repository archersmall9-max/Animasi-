name: Inbox fetch

# Source handover for an environment that cannot reach the host a file lives
# on. A GitHub runner downloads the URL and commits the result under inbox/
# so it can be pulled with git.
#
# Scope, same as the rest of this project: material you own, created, or are
# licensed to use. Nothing here bypasses authentication or DRM — a private or
# sign-in-only link simply fails with a clear message.
#
# The committed file is TEMPORARY. It is removed as soon as it has been
# pulled; see docs/COMPLIANCE.md.

on:
  push:
    paths:
      - "inbox/fetch.url"
  workflow_dispatch:
    inputs:
      url:
        description: "URL of a source you own or are licensed to use"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: inbox-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fetchers
        run: |
          python -m pip install --upgrade pip --quiet
          pip install --quiet gdown yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Resolve URL
        id: resolve
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.url }}" ]; then
            URL="${{ github.event.inputs.url }}"
          else
            URL="$(grep -vE '^\s*(#|$)' inbox/fetch.url | head -1 | tr -d '\r')"
          fi
          if [ -z "$URL" ]; then
            echo "::notice::inbox/fetch.url holds no link — nothing to collect."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Host: $(echo "$URL" | sed -E 's#^https?://([^/]+).*#\1#')"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download
        if: steps.resolve.outputs.skip != 'true'
        id: download
        run: |
          set -uo pipefail
          URL='${{ steps.resolve.outputs.url }}'
          mkdir -p .fetch/dl
          cd .fetch
          : > diag.log

          log() { echo "$@" | tee -a diag.log; }

          case "$URL" in

            *drive.google.com/drive/folders*|*drive.google.com/folderview*)
              log "=== Google Drive FOLDER ==="
              gdown --folder --no-cookies -O dl "$URL" 2>&1 | tee -a diag.log || true
              log "--- folder contents ---"
              find dl -type f -printf '%10s  %p\n' 2>/dev/null | sort -rn | tee -a diag.log
              BIG=$(find dl -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -1 | cut -f2-)
              if [ -n "${BIG:-}" ] && [ -s "$BIG" ]; then
                log "picked: $BIG"
                cp "$BIG" source.bin
              fi
              ;;

            *drive.google.com*|*docs.google.com*)
              log "=== Google Drive FILE ==="
              ID=$(echo "$URL" | sed -nE 's#.*/d/([A-Za-z0-9_-]{10,}).*#\1#p')
              [ -z "$ID" ] && ID=$(echo "$URL" | sed -nE 's#.*[?&]id=([A-Za-z0-9_-]{10,}).*#\1#p')
              log "file id: ${ID:-<none>}"

              log "--- 1/3 gdown ---"
              gdown --fuzzy --no-cookies -O source.bin "$URL" 2>&1 | tee -a diag.log || true

              if [ ! -s source.bin ] && [ -n "$ID" ]; then
                log "--- 2/3 yt-dlp ---"
                yt-dlp --no-warnings -o source.bin "https://drive.google.com/file/d/$ID/view" 2>&1 | tee -a diag.log || true
              fi

              if [ ! -s source.bin ] && [ -n "$ID" ]; then
                log "--- 3/3 confirm-token curl ---"
                curl -sL -c ck.txt "https://drive.usercontent.google.com/download?id=$ID&export=download" -o page.html
                TOKEN=$(sed -nE 's/.*name="confirm" value="([^"]+)".*/\1/p' page.html | head -1)
                UUID=$(sed -nE 's/.*name="uuid" value="([^"]+)".*/\1/p' page.html | head -1)
                curl -sL -b ck.txt \
                  "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=${TOKEN:-t}&uuid=${UUID:-}" \
                  -o source.bin 2>&1 | tee -a diag.log || true
              fi
              ;;

            *youtube.com*|*youtu.be*|*tiktok.com*|*instagram.com*|*facebook.com*|*vimeo.com*|*x.com*|*twitter.com*)
              log "=== platform URL (yt-dlp) ==="
              yt-dlp --no-playlist --no-warnings --newline \
                     -f 'bv*[height<=2160]+ba/b' --merge-output-format mp4 \
                     -o 'dl/source.%(ext)s' "$URL" 2>&1 | tee -a diag.log || true
              BIG=$(find dl -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -1 | cut -f2-)
              [ -n "${BIG:-}" ] && cp "$BIG" source.bin
              ;;

            *)
              log "=== generic URL (curl) ==="
              curl -fsSL --retry 3 --max-time 900 -o source.bin "$URL" 2>&1 | tee -a diag.log || true
              ;;
          esac

          if [ ! -s source.bin ]; then
            log "FAILED: nothing downloaded"
            echo "::error::Nothing could be downloaded. If this is Google Drive, set sharing to 'Anyone with the link'."
            exit 1
          fi

          SIZE=$(stat -c%s source.bin)
          log "downloaded bytes: $SIZE"
          log "type: $(file -b source.bin)"

          if head -c 512 source.bin | grep -qiE '<!doctype html|<html'; then
            log "FAILED: server returned HTML (login wall / quota / private link)"
            echo "::error::The server returned a web page, not a file — the link is private or requires sign-in."
            exit 1
          fi

          if ! ffprobe -v error -show_entries stream=codec_type -of csv=p=0 source.bin | grep -q video; then
            log "FAILED: no video stream"
            ffprobe -hide_banner source.bin 2>&1 | head -20 | tee -a diag.log
            echo "::error::The downloaded file contains no video stream."
            exit 1
          fi

          EXT=mp4
          case "$(file -b --mime-type source.bin)" in
            video/quicktime) EXT=mov ;;
            video/x-matroska) EXT=mkv ;;
            video/webm) EXT=webm ;;
          esac
          mv source.bin "source.$EXT"
          echo "ext=$EXT" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          sha256sum "source.$EXT" | tee -a diag.log

          log "--- probe ---"
          ffprobe -hide_banner "source.$EXT" 2>&1 | grep -E 'Duration|Stream' | tee -a diag.log

          {
            echo "### Source acquired"
            echo '```'
            tail -25 diag.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage into inbox (splitting anything over 90 MB)
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          EXT='${{ steps.download.outputs.ext }}'
          SIZE='${{ steps.download.outputs.size }}'
          rm -f inbox/source.* inbox/part_* inbox/fetch.log
          cp .fetch/diag.log inbox/fetch.log
          if [ "$SIZE" -gt 94371840 ]; then
            echo "Large file — splitting into 90 MB parts"
            split -b 90m -d -a 3 ".fetch/source.$EXT" "inbox/part_"
            echo "$EXT" > inbox/part_extension.txt
            ls -la inbox/part_*
          else
            mv ".fetch/source.$EXT" "inbox/source.$EXT"
            ls -la "inbox/source.$EXT"
          fi

      - name: Commit to the branch
        if: steps.resolve.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f inbox/
          if git diff --cached --quiet; then
            echo "Nothing to commit."; exit 0
          fi
          git commit -m "chore(inbox): temporary source handover [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "Pushed to ${{ github.ref_name }}"

      - name: Report a failure back into the branch
        if: steps.resolve.outputs.skip != 'true' && (failure())
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "run: ${{ github.run_id }}   $(date -u +%FT%TZ)"
            echo "url: ${{ steps.resolve.outputs.url }}"
            echo "--- diagnostics ---"
            cat .fetch/diag.log 2>/dev/null || echo "(none captured)"
            echo "--- first bytes of the response ---"
            head -c 600 .fetch/source.bin 2>/dev/null | tr -d '\000'
          } > inbox/fetch.log
          git add -f inbox/fetch.log
          git commit -m "chore(inbox): fetch diagnostics [skip ci]" && git push origin "HEAD:${{ github.ref_name }}"

      - name: Reminder
        if: steps.resolve.outputs.skip != 'true' && (always())
        run: |
          echo "The file under inbox/ is temporary and must be deleted once pulled." >> "$GITHUB_STEP_SUMMARY"
