[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viralcut"
version = "1.0.0"
description = "Short-form video finishing pipeline — 1080x1920, 60 fps, branded, platform-ready."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lowk67Tuff" }]
keywords = ["video", "ffmpeg", "shorts", "reels", "tiktok", "vertical-video", "editing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = ["Pillow>=10.0.0", "numpy>=1.24"]

[project.optional-dependencies]
portable = ["imageio-ffmpeg>=0.5.1"]
fetch = ["yt-dlp>=2024.1.1"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
viralcut = "viralcut.cli:main"

[tool.setuptools]
packages = ["viralcut"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
